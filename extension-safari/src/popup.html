<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px -apple-system, system-ui, sans-serif; width: 280px; padding: 14px; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .host { color: #666; font-size: 12px; margin-bottom: 10px; word-break: break-all; }
      select { width: 100%; padding: 8px; margin-bottom: 8px; }
      .preview { color: #666; font-size: 12px; margin-bottom: 10px; }
      .row { display: flex; gap: 6px; margin-bottom: 6px; }
      button { flex: 1; padding: 9px; border: 0; border-radius: 8px; background: #eef; color: #234; font-weight: 600; cursor: pointer; }
      button.primary { background: #4f7cff; color: #fff; }
      .link { background: none; color: #4f7cff; font-weight: 500; }
      #status { margin-top: 8px; font-size: 12px; color: #666; min-height: 16px; }
      #status.error { color: #c0392b; }
      #status.ok { color: #1e8e4e; }
    </style>
  </head>
  <body>
    <h1>Job Apply</h1>
    <div class="host">Page: <span id="host">…</span></div>
    <select id="app" aria-label="Application"></select>
    <div class="preview" id="preview"></div>
    <div class="row">
      <button id="copyFields">Copy fields</button>
      <button id="copyAnswers">Copy answers</button>
    </div>
    <div class="row">
      <button id="apply" class="primary">⚡ Apply for me</button>
    </div>
    <div class="row">
      <button id="options" class="link">Options</button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
