<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Responsive for desktop popups and Safari-on-iPad (44pt tap targets,
         min width, capped height with scroll). */
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font: 15px -apple-system, system-ui, sans-serif;
        width: min(360px, 92vw); min-width: 260px;
        max-height: 80vh; overflow-y: auto;
        margin: 0; padding: 14px;
      }
      h1 { font-size: 16px; margin: 0 0 8px; }
      .host { color: #666; font-size: 12px; margin-bottom: 10px; word-break: break-all; }
      select { width: 100%; min-height: 44px; padding: 8px; margin-bottom: 8px; font-size: 15px; }
      .preview { color: #666; font-size: 13px; margin-bottom: 10px; }
      .row { display: flex; gap: 8px; margin-bottom: 8px; }
      button { flex: 1; min-height: 44px; padding: 10px; border: 0; border-radius: 10px; background: #eef; color: #234; font-weight: 600; font-size: 15px; cursor: pointer; }
      button.primary { background: #4f7cff; color: #fff; }
      .link { background: none; color: #4f7cff; font-weight: 500; }
      #status { margin-top: 8px; font-size: 13px; color: #666; min-height: 18px; }
      #status.error { color: #c0392b; }
      #status.ok { color: #1e8e4e; }
    </style>
  </head>
  <body>
    <h1>Job Apply</h1>
    <div class="host">Page: <span id="host">…</span></div>
    <select id="app" aria-label="Application"></select>
    <div class="preview" id="preview"></div>
    <div class="preview" id="policy"></div>
    <div class="row">
      <button id="copyFields">Copy fields</button>
      <button id="copyAnswers">Copy answers</button>
    </div>
    <div class="row">
      <button id="apply" class="primary">⚡ Apply for me</button>
    </div>
    <div class="row">
      <button id="options" class="link">Options</button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
